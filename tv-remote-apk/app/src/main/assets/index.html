<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<title>URTV Remote</title>
<style>
:root{color-scheme:dark;--ink:#f5f3ee;--muted:#92969b;--line:#ffffff16;--glass:#15181bdc;--gold:#e4bf7c;--red:#ff6963;--green:#6fd29a}
*{box-sizing:border-box}
html{background:#090b0d}
body{margin:0;min-height:100dvh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#090b0d2b 0%,#090b0d75 23%,#090b0de8 56%,#090b0d 100%),url('/theme.jpg') center 18%/cover fixed;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:active{transform:scale(.96)}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell{width:min(100%,460px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(94px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 4px 23px}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:34px;height:34px;border:1px solid #ffffff28;border-radius:11px;display:grid;place-items:center;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:-.5px;background:#0b0e10a6}.brand-name{font-size:12px;letter-spacing:1.8px;font-weight:800}.brand-name small{display:block;margin-top:2px;color:#a9aaab;font-weight:500;font-size:9px;letter-spacing:1.3px}
.status{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:#0b0e10a8;color:#bcc0c2;font-size:11px;backdrop-filter:blur(14px)}.dot{width:7px;height:7px;border-radius:50%;background:#7d8388}.status.ready .dot{background:var(--green);box-shadow:0 0 10px #6fd29a88}.status.waiting .dot{background:var(--gold)}
.title-row{display:flex;align-items:end;justify-content:space-between;margin:0 5px 14px}.title{font-size:24px;font-weight:650;letter-spacing:-.6px;margin:0}.connection-label{font-size:10px;color:var(--muted);padding-bottom:4px}
.remote{position:relative;isolation:isolate;overflow:hidden;width:min(100%,370px);margin:auto;padding:17px 19px 19px;border-radius:39px 39px 48px 48px;border:1px solid #ffffff24;background:linear-gradient(150deg,#303437f2 0%,#1b1f22f7 28%,#111416fa 100%);box-shadow:0 26px 66px #0009,inset 0 1px #ffffff25,inset 0 -1px #0008}
.remote:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 50% -18%,#e5c58c20,transparent 44%),linear-gradient(90deg,transparent,#ffffff04 50%,transparent)}
.remote-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.icon-button{width:43px;height:43px;border:1px solid #ffffff20;border-radius:50%;background:linear-gradient(145deg,#ffffff13,#ffffff06);display:grid;place-items:center;color:#e6e4de}.power{color:#ff8179}.voice{height:40px;min-width:112px;padding:0 13px;border-radius:99px;border:1px solid #ffffff1b;background:#ffffff0a;display:flex;align-items:center;justify-content:center;gap:8px;color:#e7e3d9;font-size:11px;font-weight:600}.voice svg{width:17px;height:17px;color:var(--gold)}
.dial{width:min(100%,236px);aspect-ratio:1;margin:0 auto 15px;padding:11px;border:1px solid #ffffff20;border-radius:50%;background:radial-gradient(circle at 42% 33%,#3a3f40,#222628 62%,#171a1c);box-shadow:0 10px 25px #0009,inset 0 2px 3px #ffffff12,inset 0 -3px 6px #0008;display:grid;grid-template:1fr 1fr 1fr/1fr 1fr 1fr;gap:4px}
.dial button{display:grid;place-items:center;background:transparent;color:#d9dadd;border-radius:50%}.dial button svg{width:23px;height:23px}.dial button:active{background:#e4bf7c22}
.dial .ok{border:1px solid #ffffff24;background:radial-gradient(circle at 35% 28%,#4b5050,#282c2e 70%);box-shadow:0 2px 5px #0008,inset 0 1px #ffffff20;color:#f2d9a9;font-size:12px;font-weight:700}
.up{grid-area:1/2}.left{grid-area:2/1}.ok{grid-area:2/2}.right{grid-area:2/3}.down{grid-area:3/2}
.transport{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 2px 13px}.transport button{height:45px;border:1px solid #ffffff17;border-radius:15px;background:#ffffff09;display:flex;align-items:center;justify-content:center;gap:7px;color:#d1d2d1;font-size:11px}.transport svg{width:18px;height:18px}.transport button:nth-child(2){color:#f4eee2}
.volume{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:11px}.vol-key{width:49px;height:42px;border:1px solid #ffffff17;border-radius:14px;background:#ffffff09;font-size:21px;color:#e5e3dd}.vol-label{width:61px;text-align:center;color:#989da0;font-size:10px}.mute{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff17;background:#ffffff09;color:#c6c8c7;display:grid;place-items:center}
.media{display:flex;align-items:center;justify-content:center;gap:15px;padding-top:10px;border-top:1px solid #ffffff13}.media button{width:36px;height:36px;border-radius:50%;background:transparent;color:#b8bcbe;display:grid;place-items:center}.media .play{width:42px;height:42px;border:1px solid #ffffff22;background:#ffffff0d;color:var(--gold)}
.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px auto 0;width:min(100%,370px)}.shortcut{min-height:60px;border:1px solid #ffffff16;border-radius:18px;background:linear-gradient(145deg,#1c2022e8,#121517e8);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:650;backdrop-filter:blur(12px)}.app-icon{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800}.youtube .app-icon{background:#f32634;color:white}.shahid .app-icon{background:#7953bd;color:white}.viu .app-icon{background:#f1cd43;color:#201b08}
.view{display:none}.view.active{display:block}.touch-surface{height:380px;max-height:55vh;min-height:270px;position:relative;overflow:hidden;border:1px solid #ffffff20;border-radius:32px;background:linear-gradient(145deg,#292e31dc,#111517f2);box-shadow:inset 0 1px #ffffff18,0 20px 55px #0007;touch-action:none;display:grid;place-items:center}.touch-surface:before{content:"";position:absolute;width:144px;height:144px;border:1px solid #e4bf7c35;border-radius:50%;box-shadow:0 0 0 22px #e4bf7c0d,0 0 0 45px #e4bf7c08}.touch-hint{position:relative;color:#aeb2b3;font-size:12px;letter-spacing:.1px}.touch-hint b{display:block;color:#ede5d4;font-size:13px;font-weight:600;margin-bottom:8px}.touch-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.touch-quick button,.setting{min-height:58px;border:1px solid #ffffff16;border-radius:17px;background:#171a1de8;text-align:right;padding:13px 15px;color:#e6e3dc;font-size:12px}.touch-quick button svg{vertical-align:middle;margin-left:7px;width:17px;height:17px;color:var(--gold)}
.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.app-tile{height:112px;border:1px solid #ffffff18;border-radius:23px;background:linear-gradient(145deg,#202426ee,#111416ee);display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:650;backdrop-filter:blur(12px)}.app-tile .app-icon{width:38px;height:38px;border-radius:13px;font-size:17px}.app-tile:last-child{grid-column:1/-1;height:78px}
.settings{display:grid;gap:10px;margin-top:8px}.setting{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:60px}.setting span{display:flex;align-items:center;gap:11px}.setting svg{color:#c2c4c2}.switch{width:39px;height:23px;padding:3px;border-radius:99px;background:#4a4d4e;transition:.2s}.switch:after{content:"";display:block;width:17px;height:17px;border-radius:50%;background:#f4f4f2;transition:.2s}.setting[aria-pressed=true] .switch{background:#668f71}.setting[aria-pressed=true] .switch:after{transform:translateX(-16px)}
.link-card{margin-top:18px;padding:15px;border:1px solid #ffffff17;border-radius:18px;background:#141719de;display:flex;align-items:center;justify-content:space-between;gap:8px}.link-card span{font-size:11px;color:#aeb2b4}.link-card code{direction:ltr;color:#e5c68e;font:11px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis}
.tabs{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);padding:9px 18px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;background:linear-gradient(0deg,#090b0df5 72%,#090b0dc9);border-top:1px solid #ffffff13;backdrop-filter:blur(22px)}.tab{flex:1;min-height:48px;border-radius:15px;background:transparent;color:#969a9c;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px}.tab svg{width:18px;height:18px}.tab.active{background:#ffffff0d;color:#f1d9ac;border:1px solid #ffffff12}
.toast{position:fixed;z-index:8;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);padding:11px 16px;border:1px solid #ffffff20;border-radius:99px;background:#202426f2;color:#f5f3ee;font-size:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{display:none;position:fixed;inset:0;z-index:7;align-items:center;justify-content:center;padding:22px;background:#000a;backdrop-filter:blur(16px)}.modal.open{display:flex}.dialog{width:min(100%,370px);padding:20px;border:1px solid #ffffff21;border-radius:24px;background:#171a1dec;box-shadow:0 24px 70px #000a}.dialog h2{font-size:17px;margin:0 0 15px}.dialog input{width:100%;padding:14px;border:1px solid #ffffff1c;border-radius:14px;background:#0b0d0f;color:white;font:inherit;outline:none;user-select:text}.dialog-actions{display:flex;gap:9px;margin-top:12px}.dialog-actions button{flex:1;padding:12px;border-radius:13px;background:#ffffff10;font-size:12px}.dialog-actions .send{background:#d5b777;color:#171410;font-weight:700}
.locked .remote [data-key],.locked .shortcuts [data-launch],.locked .touch-surface{opacity:.35;pointer-events:none;filter:grayscale(1)}
.dim{filter:saturate(.72) brightness(.82)}
@media(max-width:360px){.shell{padding-left:13px;padding-right:13px}.remote{padding:15px 14px 16px;border-radius:34px}.dial{width:min(100%,218px)}.transport{gap:6px}.transport button{font-size:10px}.shortcut{font-size:10px}}
@media(min-height:900px){.remote{padding-top:20px;padding-bottom:22px}.dial{width:248px}.shortcut{min-height:65px}}
</style>
</head>
<body>
<main class="shell" id="app">
<header class="topbar">
 <div class="brand"><div class="brand-mark">UR</div><div class="brand-name">URTV<small>REMOTE</small></div></div>
 <div class="status" id="status"><i class="dot"></i><span id="statusText">يتصل</span></div>
</header>
<section class="view active" id="view-remote">
 <div class="title-row"><h1 class="title">الريموت</h1><span class="connection-label">قطعة شاومي</span></div>
 <div class="remote" id="remote">
  <div class="remote-top">
   <button class="icon-button" data-action="search" aria-label="بحث"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.5 4.5"/></svg></button>
   <button class="voice" data-action="assistant"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/></svg><span>صوت</span></button>
   <button class="icon-button power" data-key="26" aria-label="طاقة"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M6.2 5.7a8 8 0 1 0 11.6 0"/></svg></button>
  </div>
  <div class="dial" aria-label="أزرار الاتجاه">
   <button class="up" data-key="19" aria-label="أعلى"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button>
   <button class="left" data-key="21" aria-label="يسار"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
   <button class="ok" data-key="23" aria-label="موافق">موافق</button>
   <button class="right" data-key="22" aria-label="يمين"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
   <button class="down" data-key="20" aria-label="أسفل"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button>
  </div>
  <div class="transport">
   <button data-key="4" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m10 6-6 6 6 6"/><path d="M4 12h10a6 6 0 0 1 6 6"/></svg><span>رجوع</span></button>
   <button data-key="3" aria-label="الرئيسية"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span>الرئيسية</span></button>
   <button data-key="187" aria-label="التطبيقات"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01"/></svg><span>التطبيقات</span></button>
  </div>
  <div class="volume">
   <button class="vol-key" data-key="25" aria-label="خفض الصوت">−</button><span class="vol-label">الصوت</span><button class="vol-key" data-key="24" aria-label="رفع الصوت">+</button>
   <button class="mute" data-key="164" aria-label="كتم الصوت"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="m17 9 4 6m0-6-4 6"/></svg></button>
  </div>
  <div class="media">
   <button data-key="89" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg></button>
   <button class="play" data-key="85" aria-label="تشغيل أو إيقاف"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
   <button data-key="90" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 6l9 6-9 6z"/></svg></button>
  </div>
 </div>
 <div class="shortcuts">
  <button class="shortcut youtube" data-launch="youtube"><i class="app-icon">▶</i><span>YouTube</span></button>
  <button class="shortcut shahid" data-launch="shahid"><i class="app-icon">ش</i><span>شاهد</span></button>
  <button class="shortcut viu" data-launch="viu"><i class="app-icon">V</i><span>Viu</span></button>
 </div>
</section>
<section class="view" id="view-touch">
 <div class="title-row"><h1 class="title">لوحة اللمس</h1><span class="connection-label">اسحب للتنقل</span></div>
 <div class="touch-surface" id="touchpad"><div class="touch-hint"><b>لوحة تحكم</b>اسحب أو انقر مرتين للاختيار</div></div>
 <div class="touch-quick">
  <button data-key="3"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>الرئيسية</button>
  <button data-action="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.5 4.5"/></svg>بحث</button>
 </div>
</section>
<section class="view" id="view-apps">
 <div class="title-row"><h1 class="title">التطبيقات</h1><span class="connection-label">فتح مباشر</span></div>
 <div class="app-grid">
  <button class="app-tile youtube" data-launch="youtube"><i class="app-icon">▶</i><span>YouTube</span></button>
  <button class="app-tile shahid" data-launch="shahid"><i class="app-icon">ش</i><span>شاهد</span></button>
  <button class="app-tile viu" data-launch="viu"><i class="app-icon">V</i><span>Viu</span></button>
 </div>
</section>
<section class="view" id="view-more">
 <div class="title-row"><h1 class="title">الإعدادات</h1><span class="connection-label">على هذا الجوال</span></div>
 <div class="settings">
  <button class="setting" id="haptics" aria-pressed="true"><span><svg viewBox="0 0 24 24"><path d="M8 5a2 2 0 0 1 4 0v7-8a2 2 0 0 1 4 0v8-6a2 2 0 0 1 4 0v9c0 4-2 6-6 6h-2c-2 0-3-1-4-2l-4-5a2 2 0 0 1 3-3l2 2"/></svg>اهتزاز اللمس</span><i class="switch"></i></button>
  <button class="setting" id="lock" aria-pressed="false"><span><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>قفل الأزرار</span><i class="switch"></i></button>
  <button class="setting" id="dim" aria-pressed="false"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z"/></svg>مظهر هادئ</span><i class="switch"></i></button>
  <button class="setting" id="refresh"><span><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.6-2L20 12M4 12l2.9 5a7 7 0 0 0 11.6-2"/></svg>فحص الاتصال</span><span class="switch" style="opacity:0;flex:none"></span></button>
 </div>
 <div class="link-card"><span>الرابط المحلي</span><code id="address">—</code><button id="copy" class="setting" style="width:auto;min-height:34px;padding:7px 11px">نسخ</button></div>
</section>
</main>
<nav class="tabs" aria-label="التنقل">
 <button class="tab active" data-view="remote"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="5"/><circle cx="12" cy="10" r="3"/><path d="M9 17h6"/></svg>الريموت</button>
 <button class="tab" data-view="touch"><svg viewBox="0 0 24 24"><path d="M8 12V6a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v7-4a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-4a2 2 0 0 1 3-3l2 2"/></svg>لمس</button>
 <button class="tab" data-view="apps"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>التطبيقات</button>
 <button class="tab" data-view="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 1 1-4 0v-.3A2 2 0 0 0 5.8 17l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 11H1.5a2 2 0 1 1 0-4h.3a2 2 0 0 0 1.4-3.4l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.4 1.4v-.3a2 2 0 1 1 4 0v.3a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 21.1 9h.3a2 2 0 1 1 0 4h-.3a2 2 0 0 0-1.7 2z"/></svg>المزيد</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" aria-hidden="true"><div class="dialog"><h2>البحث في التلفزيون</h2><input id="query" placeholder="اكتب عبارة البحث" autocomplete="off"><div class="dialog-actions"><button id="cancel">إلغاء</button><button class="send" id="send">إرسال</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let toastTimer,repeatTimer,tapTimer,point=null;
let haptics=localStorage.getItem('urtv-haptics')!=='off',locked=false,dimmed=localStorage.getItem('urtv-dim')==='on';
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function buzz(){if(haptics&&navigator.vibrate)navigator.vibrate(8)}
function setStatus(kind,label){const status=$('status');status.className='status '+kind;$('statusText').textContent=label}
async function req(path,options={}){const response=await fetch(path,{cache:'no-store',...options});let data={};try{data=await response.json()}catch{}if(!response.ok||data.ok===false)throw new Error(data.error||'تعذر تنفيذ الأمر');return data}
async function key(code){buzz();try{await req('/api/key/'+code,{method:'POST'})}catch(e){setStatus('waiting','تحقق من الاتصال');toast(e.message||'تعذر إرسال الأمر')}}
async function launch(name){buzz();try{await req('/api/launch/'+encodeURIComponent(name),{method:'POST'});toast('')}catch(e){setStatus('waiting','تحقق من الاتصال');toast(e.message||'تعذر فتح التطبيق')}}
async function assistant(){buzz();try{await req('/api/assistant',{method:'POST'})}catch(e){toast(e.message||'تعذر تشغيل الصوت')}}
async function refreshStatus(showToast=false){try{const health=await req('/api/health');if(health.adbConnected)setStatus('ready','جاهز');else setStatus('waiting','تحقق من USB');$('address').textContent=location.origin;if(showToast)toast(health.adbConnected?'الاتصال جاهز':'وافق على تصحيح USB في التلفزيون')}catch{setStatus('','غير متصل');if(showToast)toast('تأكد من واي فاي البيت')}}
async function copyAddress(){try{await navigator.clipboard.writeText(location.origin);toast('تم نسخ الرابط')}catch{toast('انسخ العنوان من شريط المتصفح')}}
function openSearch(){$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');setTimeout(()=>$('query').focus(),80)}
function closeSearch(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');$('query').value=''}
async function sendSearch(){const value=$('query').value.trim();if(!value)return closeSearch();closeSearch();try{await req('/api/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:value})})}catch(e){toast(e.message||'تعذر إرسال النص')}}
function switchView(name){document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view===name));document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id==='view-'+name));window.scrollTo({top:0,behavior:'smooth'});buzz()}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>switchView(tab.dataset.view)));
document.querySelectorAll('[data-key]').forEach(button=>{const code=Number(button.dataset.key);button.addEventListener('pointerdown',event=>{event.preventDefault();key(code);if([19,20,21,22,24,25].includes(code))repeatTimer=setTimeout(()=>repeatTimer=setInterval(()=>key(code),190),420)});['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,()=>{clearTimeout(repeatTimer);clearInterval(repeatTimer)}))});
document.querySelectorAll('[data-launch]').forEach(button=>button.addEventListener('click',()=>launch(button.dataset.launch)));
document.querySelectorAll('[data-action="assistant"]').forEach(button=>button.addEventListener('click',assistant));
document.querySelectorAll('[data-action="search"]').forEach(button=>button.addEventListener('click',openSearch));
$('cancel').addEventListener('click',closeSearch);$('send').addEventListener('click',sendSearch);$('modal').addEventListener('click',event=>{if(event.target===$('modal'))closeSearch()});$('query').addEventListener('keydown',event=>{if(event.key==='Enter')sendSearch();if(event.key==='Escape')closeSearch()});
$('haptics').setAttribute('aria-pressed',String(haptics));$('haptics').addEventListener('click',()=>{haptics=!haptics;localStorage.setItem('urtv-haptics',haptics?'on':'off');$('haptics').setAttribute('aria-pressed',String(haptics));buzz()});
$('lock').addEventListener('click',()=>{locked=!locked;$('app').classList.toggle('locked',locked);$('lock').setAttribute('aria-pressed',String(locked));toast(locked?'الأزرار مقفلة':'الأزرار جاهزة')});
function applyDim(){document.body.classList.toggle('dim',dimmed);$('dim').setAttribute('aria-pressed',String(dimmed))}
$('dim').addEventListener('click',()=>{dimmed=!dimmed;localStorage.setItem('urtv-dim',dimmed?'on':'off');applyDim()});$('refresh').addEventListener('click',()=>refreshStatus(true));$('copy').addEventListener('click',copyAddress);
const pad=$('touchpad');pad.addEventListener('pointerdown',event=>{point={x:event.clientX,y:event.clientY};pad.setPointerCapture(event.pointerId)});pad.addEventListener('pointerup',event=>{if(!point)return;const dx=event.clientX-point.x,dy=event.clientY-point.y;point=null;if(Math.hypot(dx,dy)<24){if(tapTimer){clearTimeout(tapTimer);tapTimer=null;key(23)}else tapTimer=setTimeout(()=>{tapTimer=null;key(23)},250);return}key(Math.abs(dx)>Math.abs(dy)?(dx>0?22:21):(dy>0?20:19))});pad.addEventListener('pointercancel',()=>point=null);
document.addEventListener('keydown',event=>{if($('modal').classList.contains('open'))return;const keys={ArrowUp:19,ArrowDown:20,ArrowLeft:21,ArrowRight:22,Enter:23,Escape:4,Home:3,PageUp:24,PageDown:25};if(keys[event.key]){event.preventDefault();key(keys[event.key])}});
applyDim();refreshStatus();setInterval(refreshStatus,15000);
</script>
</body>
</html>
